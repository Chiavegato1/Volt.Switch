<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Compra confirmada | Volt Switch</title><link rel="stylesheet" href="../../css/base/base.css"><link rel="stylesheet" href="../../css/componentes/componentes.css"><link rel="stylesheet" href="../../css/paginas/paginas.css"></head><body><header class="header-principal"><div class="logo"><a href="../../index.html">VOLT SWITCH <span>Eletrônicos</span></a></div><div class="acoes-usuario"><a href="../autenticacao/autenticacao.html">Trocar conta</a><a href="../../index.html">Voltar à loja</a></div></header>
<main class="painel-conteudo"><h1>Pedido realizado!</h1><p>Seu pedido de demonstração foi registrado com sucesso.</p><p id="numero-pedido"></p><a class="btn-comprar" href="../../index.html">Voltar para a loja</a></main>
<script src="../../js/services/services.js"></script><script>
const carrinhoPedido = lerDados("voltCarrinho", []);
let totalPedido = 0;
carrinhoPedido.forEach(item => { const produto = produtos.find(p => p.id === item.id); if (produto) totalPedido += produto.preco * item.quantidade; });
let pedidos = lerDados("voltPedidos", []);
const numero = Date.now();
pedidos.push({ numero: numero, status: "Aguardando separação", total: formatarPreco(totalPedido), itens: carrinhoPedido });
salvarDados("voltPedidos", pedidos);
salvarDados("voltCarrinho", []);
document.getElementById("numero-pedido").textContent = "Número do pedido: " + numero + " | Total: " + formatarPreco(totalPedido);
</script></body></html>
