<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel administrativo | Volt Switch</title><link rel="stylesheet" href="../../css/base/base.css"><link rel="stylesheet" href="../../css/componentes/componentes.css"><link rel="stylesheet" href="../../css/paginas/paginas.css"><link rel="stylesheet" href="../../css/admin/admin.css"></head><body><header class="header-principal"><div class="logo"><a href="../../index.html">VOLT SWITCH <span>Eletrônicos</span></a></div><div class="acoes-usuario"><a href="../autenticacao/autenticacao.html">Trocar conta</a><a href="../../index.html">Voltar à loja</a></div></header>
<main class="painel-conteudo"><h1>Painel administrativo</h1><p>Área de demonstração para gerenciamento geral da Volt Switch.</p>
<h2>Resumo da loja</h2><p id="resumo-admin"></p>
<h2>Contas cadastradas</h2><div id="lista-usuarios"></div>
<h2>Pedidos registrados</h2><div id="lista-pedidos"></div>
</main><script>
const usuariosAdmin = JSON.parse(localStorage.getItem("voltUsuarios") || "[]");
document.getElementById("resumo-admin").textContent = usuariosAdmin.length + " conta(s) cadastrada(s).";
document.getElementById("lista-usuarios").innerHTML = usuariosAdmin.length ? "<ul>" + usuariosAdmin.map(u => "<li>" + u.nome + " - " + u.email + " (" + u.tipo + ")</li>").join("") + "</ul>" : "<p>Nenhuma conta cadastrada.</p>";
const pedidosAdmin = JSON.parse(localStorage.getItem("voltPedidos") || "[]");
document.getElementById("lista-pedidos").innerHTML = pedidosAdmin.length ? "<ul>" + pedidosAdmin.map(p => "<li>Pedido " + p.numero + " - " + p.status + " - " + p.total + "</li>").join("") + "</ul>" : "<p>Nenhum pedido registrado.</p>";
</script><script src="../../js/admin/admin.js"></script></body></html>
