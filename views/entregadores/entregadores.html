<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel do entregador | Volt Switch</title><link rel="stylesheet" href="../../css/base/base.css"><link rel="stylesheet" href="../../css/componentes/componentes.css"><link rel="stylesheet" href="../../css/paginas/paginas.css"><link rel="stylesheet" href="../../css/entregador/entregador.css"></head><body><header class="header-principal"><div class="logo"><a href="../../index.html">VOLT SWITCH <span>Eletrônicos</span></a></div><div class="acoes-usuario"><a href="../autenticacao/autenticacao.html">Trocar conta</a><a href="../../index.html">Voltar à loja</a></div></header>
<main class="painel-conteudo"><h1>Painel do entregador</h1><p>Acompanhe os pedidos disponíveis para entrega.</p><div id="entregas-disponiveis"></div></main>
<script>
const entregas = JSON.parse(localStorage.getItem("voltPedidos") || "[]");
const area = document.getElementById("entregas-disponiveis");
area.innerHTML = entregas.length ? entregas.map(p => "<div class='item-carrinho'><div class='dados-item'><h3>Pedido " + p.numero + "</h3><p>Status: " + p.status + "</p></div><button onclick='marcarEntregue(" + p.numero + ")'>Marcar como entregue</button></div>").join("") : "<p>Nenhuma entrega disponível.</p>";
function marcarEntregue(numero) {
 let pedidos = JSON.parse(localStorage.getItem("voltPedidos") || "[]");
 let pedido = pedidos.find(p => p.numero === numero);
 if (pedido) pedido.status = "Entregue";
 localStorage.setItem("voltPedidos", JSON.stringify(pedidos));
 location.reload();
}
</script><script src="../../js/entregador/entregador.js"></script></body></html>
